<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161822" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Squircle Background with Micro-Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="2" />

  <!-- Terminal Prompt Chevron '>' -->
  <path d="M18 20 L32 32 L18 44" fill="none" stroke="url(#brandGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Terminal Blinking Cursor Underscore '_' -->
  <line x1="38" y1="44" x2="48" y2="44" stroke="#FACC15" stroke-width="5.5" stroke-linecap="round" />
</svg>
